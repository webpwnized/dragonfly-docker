# Scan Dockerfiles and Docker Compose configuration for misconfigurations.
name: Scan Dockerfile with KICS

on:
  # Scan the full configured targets in pull requests.
  pull_request: {}

  # Allow manual execution from GitHub Actions.
  workflow_dispatch: {}

  # Refresh findings after changes reach development.
  push:
    branches:
      - development

jobs:
  kics-job:
    # Preserve the existing job name for required status checks.
    name: KICS Github Action
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Read repository contents and workflow metadata.
      actions: read
      contents: read

      # Publish SARIF findings to GitHub Code Scanning.
      security-events: write

    steps:
      - name: Checkout code
        id: checkout
        # Dependabot can update this pinned action reference.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfiles with KICS
        uses: Checkmarx/kics-github-action@v2.2.1
        with:
          # Scan Dockerfiles within the existing build directory.
          path: .build/www
          type: Dockerfile

          # Keep the output directory directly under the repository root.
          # This avoids the nested report-path problem in this action version.
          output_path: kics-dockerfile-reports
          output_name: results

          # GitHub consumes SARIF; the KICS action also reads JSON.
          output_formats: sarif,json
          verbose: true

          # Report findings without failing the job.
          # Scanner execution errors still fail the step.
          ignore_on_exit: results

      - name: Scan Docker Compose with KICS
        # Continue after a Dockerfile scan failure if checkout succeeded.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: Checkmarx/kics-github-action@v2.2.1
        with:
          # Scan the tracked Compose file directly.
          path: .build/docker-compose.yaml
          type: DockerCompose

          # Separate directories prevent the scans from overwriting reports.
          output_path: kics-compose-reports
          output_name: results
          output_formats: sarif,json
          verbose: true
          ignore_on_exit: results

      - name: View KICS Dockerfile report
        # Print the report whenever it exists, including after scan failures.
        if: ${{ !cancelled() && hashFiles('kics-dockerfile-reports/results.sarif') != '' }}
        shell: bash
        run: cat kics-dockerfile-reports/results.sarif

      - name: View KICS Compose report
        if: ${{ !cancelled() && hashFiles('kics-compose-reports/results.sarif') != '' }}
        shell: bash
        run: cat kics-compose-reports/results.sarif

      - name: Upload Dockerfile results to GitHub Code Scanning
        # Skip upload if the scanner did not produce a report.
        if: ${{ !cancelled() && hashFiles('kics-dockerfile-reports/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: kics-dockerfile-reports/results.sarif
          category: KICS Dockerfile Scan

      - name: Upload Compose results to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('kics-compose-reports/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: kics-compose-reports/results.sarif

          # Separate categories preserve both scan reports on the same commit.
          category: KICS Docker Compose Scan