# Dependabot configuration for the Dragonfly Docker repository.
version: 2

updates:
  # GitHub Actions updates for main.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # GitHub Actions updates for development.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Review base-image updates for the Dockerfile that builds www.
  - package-ecosystem: docker
    directory: /.build/www
    schedule:
      interval: weekly